[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-memory"
version = "0.1.0"
description = "Caching, retry and resilient-HTTP helpers for FastAPI services."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alexander Stankovic", email = "alexdarka@gmail.com" },
]
keywords = ["fastapi", "cache", "caching", "retry", "tenacity", "httpx", "resilience", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "fastapi-cache2>=0.2.2",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/alexdarka/fastapi-memory"
Repository = "https://github.com/alexdarka/fastapi-memory"

[tool.setuptools.packages.find]
include = ["fastapi_memory*"]

[tool.setuptools.package-data]
fastapi_memory = ["py.typed"]
